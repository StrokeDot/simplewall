<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SimpleWall</title>
<style>
:root {
  --font: 'Google Sans Flex', 'Segoe UI Variable', 'Segoe UI', system-ui, -apple-system, sans-serif;
  --mono: 'Cascadia Mono', 'Consolas', monospace;
  --radius: 10px;
  --radius-sm: 7px;
  --radius-pill: 999px;
  --transition: 140ms ease;
}

[data-theme="dark"] {
  --bg: #0c1017;
  --bg-elev: #131924;
  --bg-card: #18202e;
  --bg-hover: #1f293b;
  --bg-active: #25334a;
  --bg-input: #0f1520;
  --border: rgba(255, 255, 255, 0.08);
  --border-strong: rgba(255, 255, 255, 0.14);
  --text: #eef2f8;
  --text-2: #9aa7bd;
  --text-3: #6c7a93;
  --accent: #3b82f6;
  --accent-soft: rgba(59, 130, 246, 0.16);
  --green: #22c55e;
  --green-soft: rgba(34, 197, 94, 0.15);
  --amber: #f59e0b;
  --amber-soft: rgba(245, 158, 11, 0.16);
  --red: #ef4444;
  --red-soft: rgba(239, 68, 68, 0.16);
  --shadow: 0 10px 30px rgba(0, 0, 0, 0.42);
}

[data-theme="light"] {
  --bg: #f3f6fb;
  --bg-elev: #ffffff;
  --bg-card: #ffffff;
  --bg-hover: #f0f4fa;
  --bg-active: #e6eefb;
  --bg-input: #f8fafd;
  --border: rgba(15, 23, 42, 0.09);
  --border-strong: rgba(15, 23, 42, 0.16);
  --text: #0f172a;
  --text-2: #475569;
  --text-3: #64748b;
  --accent: #2563eb;
  --accent-soft: rgba(37, 99, 235, 0.11);
  --green: #16a34a;
  --green-soft: rgba(22, 163, 74, 0.12);
  --amber: #d97706;
  --amber-soft: rgba(217, 119, 6, 0.13);
  --red: #dc2626;
  --red-soft: rgba(220, 38, 38, 0.12);
  --shadow: 0 10px 28px rgba(15, 23, 42, 0.10);
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body {
  width: 100%; height: 100%;
  font-family: var(--font);
  font-size: 13.5px;
  color: var(--text);
  background: var(--bg);
  overflow: hidden;
  user-select: none;
  -webkit-font-smoothing: antialiased;
}

.app {
  display: flex;
  width: 100%;
  height: 100%;
}

/* Sidebar */
.sidebar {
  width: 230px;
  flex-shrink: 0;
  background: var(--bg-elev);
  border-right: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  padding: 16px 12px;
  gap: 6px;
}

.brand {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 6px 10px 14px;
  border-bottom: 1px solid var(--border);
  margin-bottom: 8px;
}

.brand-logo {
  width: 34px; height: 34px;
  border-radius: 9px;
  background: linear-gradient(135deg, #2563eb, #06b6d4);
  display: grid; place-items: center;
  color: #fff;
  font-weight: 700;
  font-size: 15px;
  box-shadow: 0 4px 12px rgba(37, 99, 235, 0.35);
}

.brand-title {
  font-weight: 700;
  font-size: 16px;
  letter-spacing: -0.35px;
  line-height: 1.15;
  display: flex;
  align-items: baseline;
  gap: 0;
}
.brand-title .wall-accent {
  background: linear-gradient(135deg, #ff7a18, #ef4444);
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
}
.brand-sub {
  font-size: 11px;
  font-weight: 500;
  color: var(--text-3);
  margin-top: 2px;
  letter-spacing: 0.1px;
}

.nav-item {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 9px 11px;
  border-radius: var(--radius-sm);
  color: var(--text-2);
  cursor: pointer;
  border: 1px solid transparent;
  background: transparent;
  width: 100%;
  text-align: left;
  font: inherit;
  font-weight: 500;
  transition: background var(--transition), color var(--transition), border-color var(--transition);
}

.nav-item:hover { background: var(--bg-hover); color: var(--text); }
.nav-item.active {
  background: var(--accent-soft);
  color: var(--accent);
  border-color: rgba(59, 130, 246, 0.22);
  font-weight: 600;
}

.nav-icon { width: 17px; height: 17px; flex-shrink: 0; opacity: 0.9; }
.nav-label { flex: 1; }
.nav-badge {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 7px;
  border-radius: var(--radius-pill);
  background: var(--bg-hover);
  color: var(--text-2);
}
.nav-badge.warn { background: var(--amber-soft); color: var(--amber); }
.nav-badge.danger { background: var(--red-soft); color: var(--red); }
.nav-badge.ok { background: var(--green-soft); color: var(--green); }

.sidebar-footer {
  margin-top: auto;
  padding-top: 12px;
  border-top: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  gap: 8px;
}

.theme-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 6px 8px;
  border-radius: var(--radius-sm);
  background: var(--bg-card);
  border: 1px solid var(--border);
  font-size: 12px;
  color: var(--text-2);
}

.segmented {
  display: inline-flex;
  align-items: center;
  flex-shrink: 0;
  background: var(--bg-input);
  border-radius: 8px;
  padding: 3px;
  border: 1px solid var(--border);
}

.segmented button {
  border: none;
  background: transparent;
  color: var(--text-2);
  padding: 5px 11px;
  border-radius: 6px;
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  white-space: nowrap;
  cursor: pointer;
  transition: all var(--transition);
}

.segmented button.active {
  background: var(--accent);
  color: #fff;
}

/* Main workspace */
.main {
  flex: 1;
  min-width: 0;
  display: flex;
  flex-direction: column;
  height: 100%;
}

/* Top bar */
.topbar {
  height: 60px;
  flex-shrink: 0;
  background: var(--bg-elev);
  border-bottom: 1px solid var(--border);
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 0 20px;
}

.mode-bar {
  display: inline-flex;
  align-items: center;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 3px;
  gap: 2px;
  position: relative;
}

.mode-btn {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  padding: 6px 12px;
  border-radius: var(--radius-pill);
  border: none;
  background: transparent;
  color: var(--text-2);
  font: inherit;
  font-size: 12.5px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.mode-btn:hover { color: var(--text); background: var(--bg-hover); }
.mode-btn.active-strict { background: var(--green-soft); color: var(--green); }
.mode-btn.active-safe { background: var(--amber-soft); color: var(--amber); }
.mode-btn.active-off { background: var(--red-soft); color: var(--red); }

.dot { width: 8px; height: 8px; border-radius: 50%; display: inline-block; }
.dot-green { background: var(--green); box-shadow: 0 0 8px var(--green); }
.dot-amber { background: var(--amber); box-shadow: 0 0 8px var(--amber); }
.dot-red { background: var(--red); }

.dropdown-menu {
  position: absolute;
  top: calc(100% + 6px);
  left: 90px;
  min-width: 240px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  box-shadow: var(--shadow);
  padding: 6px;
  z-index: 100;
  display: none;
}
.dropdown-menu.open { display: block; }
.dropdown-title {
  font-size: 11px;
  color: var(--text-3);
  padding: 6px 10px 4px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.4px;
}
.dropdown-item {
  width: 100%;
  border: none;
  background: transparent;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  text-align: left;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: space-between;
}
.dropdown-item:hover { background: var(--bg-hover); }
.dropdown-item small { color: var(--text-3); font-size: 11.5px; }

.search-wrap {
  flex: 1;
  max-width: 380px;
  margin-left: auto;
  position: relative;
}

.search-input {
  width: 100%;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-pill);
  padding: 7px 14px 7px 34px;
  color: var(--text);
  font: inherit;
  font-size: 13px;
  outline: none;
  transition: border-color var(--transition);
}
.search-input:focus { border-color: var(--accent); }
.search-icon {
  position: absolute;
  left: 11px; top: 50%;
  transform: translateY(-50%);
  width: 15px; height: 15px;
  color: var(--text-3);
  pointer-events: none;
}

.icon-btn {
  width: 34px; height: 34px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-2);
  display: grid; place-items: center;
  cursor: pointer;
  transition: all var(--transition);
}
.icon-btn:hover { background: var(--bg-hover); color: var(--text); border-color: var(--border-strong); }

/* Safe Pause Banner */
.banner {
  padding: 10px 20px;
  display: none;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  font-size: 13px;
  font-weight: 500;
  border-bottom: 1px solid var(--border);
}
.banner.show { display: flex; }
.banner.safe { background: var(--amber-soft); color: var(--amber); }
.banner.off { background: var(--red-soft); color: var(--red); }

/* Content + Inspector split */
.workspace {
  flex: 1;
  min-height: 0;
  display: flex;
  overflow: hidden;
  position: relative;
}

.content {
  flex: 1;
  min-width: 0;
  overflow-y: auto;
  padding: 22px 24px 32px;
}

.inspector-backdrop {
  position: absolute;
  inset: 0;
  background: rgba(0, 0, 0, 0.38);
  backdrop-filter: blur(2px);
  z-index: 40;
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  transition: opacity 220ms cubic-bezier(0.22, 1, 0.36, 1), visibility 220ms;
}
.inspector-backdrop.open {
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

/* Custom scrollbars */
::-webkit-scrollbar { width: 8px; height: 8px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--border-strong); border-radius: 8px; }
::-webkit-scrollbar-thumb:hover { background: var(--text-3); }

/* Page headers */
.page-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 16px;
  margin-bottom: 18px;
}
.page-title { font-size: 21px; font-weight: 700; letter-spacing: -0.2px; }
.page-sub { font-size: 13px; color: var(--text-2); margin-top: 3px; }

/* Buttons */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 7px;
  padding: 8px 14px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  color: var(--text);
  font: inherit;
  font-size: 13px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
  white-space: nowrap;
}
.btn:hover:not(:disabled) { background: var(--bg-hover); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn-primary:hover:not(:disabled) { filter: brightness(1.08); background: var(--accent); }
.btn-green { background: var(--green-soft); border-color: rgba(34,197,94,0.3); color: var(--green); }
.btn-green:hover:not(:disabled) { background: var(--green); color: #fff; }
.btn-amber { background: var(--amber-soft); border-color: rgba(245,158,11,0.35); color: var(--amber); }
.btn-amber:hover:not(:disabled) { background: var(--amber); color: #111; }
.btn-blue { background: var(--accent-soft); border-color: rgba(59,130,246,0.35); color: var(--accent); }
.btn-blue:hover:not(:disabled) { background: var(--accent); color: #fff; }
.btn-red { background: var(--red-soft); border-color: rgba(239,68,68,0.3); color: var(--red); }
.btn-red:hover:not(:disabled) { background: var(--red); color: #fff; }
.btn-sm { padding: 5px 10px; font-size: 12px; }

/* Cards & Grids */
.grid-4 {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.grid-3 {
  display: grid;
  grid-template-columns: repeat(3, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 18px;
}

.grid-2 {
  display: grid;
  grid-template-columns: repeat(2, minmax(0, 1fr));
  gap: 12px;
  margin-bottom: 16px;
}

@media (max-width: 980px) {
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .grid-3 { grid-template-columns: 1fr; }
  .grid-2 { grid-template-columns: 1fr; }
}

.card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 16px;
}

.stat-card {
  cursor: pointer;
  transition: transform var(--transition), border-color var(--transition), background var(--transition);
}
.stat-card:hover { transform: translateY(-1px); border-color: var(--border-strong); background: var(--bg-hover); }
.stat-label { font-size: 12px; color: var(--text-2); font-weight: 500; }
.stat-val { font-size: 28px; font-weight: 700; margin-top: 6px; letter-spacing: -0.5px; }
.stat-hint { font-size: 11.5px; color: var(--text-3); margin-top: 4px; }

.mode-card {
  cursor: pointer;
  display: flex;
  flex-direction: column;
  gap: 8px;
  border: 1.5px solid var(--border);
  transition: all var(--transition);
}
.mode-card:hover { border-color: var(--border-strong); background: var(--bg-hover); }
.mode-card.selected-strict { border-color: var(--green); background: var(--green-soft); }
.mode-card.selected-safe { border-color: var(--amber); background: var(--amber-soft); }
.mode-card.selected-off { border-color: var(--red); background: var(--red-soft); }
.mode-card-title { font-size: 15px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
.mode-card-desc { font-size: 12.5px; color: var(--text-2); line-height: 1.45; }

/* Filter chips */
.toolbar-row {
  display: flex;
  flex-wrap: wrap;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  margin-bottom: 14px;
}

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }

.chip {
  padding: 5px 11px;
  border-radius: var(--radius-pill);
  border: 1px solid var(--border);
  background: var(--bg-card);
  color: var(--text-2);
  font: inherit;
  font-size: 12px;
  font-weight: 600;
  cursor: pointer;
  transition: all var(--transition);
}
.chip:hover { color: var(--text); border-color: var(--border-strong); }
.chip.active { background: var(--accent-soft); color: var(--accent); border-color: rgba(59,130,246,0.35); }

/* App List */
.list {
  display: flex;
  flex-direction: column;
  gap: 6px;
}

/* Company Groups */
.company-groups {
  display: flex;
  flex-direction: column;
  gap: 12px;
}
.company-group {
  background: rgba(255,255,255,0.015);
  border: 1px solid var(--border);
  border-radius: 13px;
  overflow: hidden;
}
[data-theme="light"] .company-group {
  background: rgba(15,23,42,0.015);
}
.company-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 10px;
  padding: 10px 14px;
  cursor: pointer;
  user-select: none;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  transition: background var(--transition);
}
.company-group.collapsed .company-header {
  border-bottom-color: transparent;
}
.company-header:hover {
  background: var(--bg-hover);
}
.company-header-left {
  display: flex;
  align-items: center;
  gap: 9px;
  min-width: 0;
}
.company-chevron {
  width: 18px;
  height: 18px;
  display: grid;
  place-items: center;
  color: var(--text-3);
  font-size: 12px;
  transition: transform 160ms ease;
  flex-shrink: 0;
}
.company-group.collapsed .company-chevron {
  transform: rotate(-90deg);
}
.company-title {
  font-size: 13.5px;
  font-weight: 700;
  color: var(--text);
  letter-spacing: -0.01em;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}
.company-meta {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}
.company-body {
  padding: 8px;
  display: flex;
  flex-direction: column;
  gap: 6px;
}
.company-group.collapsed .company-body {
  display: none;
}

.wake-select {
  width: 100%;
  padding: 8px 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-card);
  color: var(--text);
  font: inherit;
  font-size: 12.5px;
  outline: none;
  cursor: pointer;
}
.wake-select:focus {
  border-color: var(--accent);
}

.app-row {
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 11px 15px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 11px;
  cursor: pointer;
  min-width: 0;
  overflow: hidden;
  transition: background var(--transition), border-color var(--transition), box-shadow var(--transition);
}
.app-row:hover { background: var(--bg-hover); border-color: var(--border-strong); }
.app-row.selected { background: var(--bg-active); border-color: var(--accent); }

.app-icon {
  width: 38px; height: 38px;
  border-radius: 10px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  display: grid; place-items: center;
  flex-shrink: 0;
  overflow: hidden;
  font-weight: 700;
  font-size: 14px;
  color: var(--text-2);
}
.app-icon.has-logo {
  background: transparent;
  border: none;
  border-radius: 0;
  overflow: visible;
}
.app-icon img {
  width: 36px;
  height: 36px;
  object-fit: contain;
  filter: drop-shadow(0 2px 5px rgba(0, 0, 0, 0.22));
}

.app-main { flex: 1; min-width: 0; overflow: hidden; }
.app-name-line {
  display: flex;
  align-items: center;
  gap: 7px;
  flex-wrap: nowrap;
  min-width: 0;
  overflow: hidden;
}
.app-name {
  font-weight: 600;
  font-size: 13.5px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  min-width: 0;
  flex-shrink: 1;
}
.app-sub {
  font-size: 12px;
  color: var(--text-2);
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.pill {
  display: inline-flex;
  align-items: center;
  gap: 5px;
  font-size: 11px;
  font-weight: 600;
  padding: 3px 9px;
  border-radius: var(--radius-pill);
  border: 1px solid transparent;
  white-space: nowrap;
  letter-spacing: 0.01em;
}
.pill-green { background: var(--green-soft); color: var(--green); border-color: rgba(34, 197, 94, 0.24); }
.pill-red { background: var(--red-soft); color: var(--red); border-color: rgba(239, 68, 68, 0.24); }
.pill-amber { background: var(--amber-soft); color: var(--amber); border-color: rgba(245, 158, 11, 0.26); }
.pill-blue { background: var(--accent-soft); color: var(--accent); border-color: rgba(59, 130, 246, 0.24); }
.pill-muted { background: var(--bg-hover); color: var(--text-3); border-color: var(--border); }

.row-actions {
  display: flex;
  align-items: center;
  gap: 6px;
  flex-shrink: 0;
}

/* Inspector Drawer — silky 60fps slide-over so the list NEVER gets squished! */
.inspector {
  position: absolute;
  top: 0;
  right: 0;
  bottom: 0;
  width: min(370px, calc(100% - 24px));
  background: var(--bg-elev);
  border-left: 1px solid var(--border-strong);
  box-shadow: var(--shadow);
  z-index: 50;
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 18px;
  gap: 14px;
  transform: translateX(100%);
  opacity: 0;
  visibility: hidden;
  pointer-events: none;
  will-change: transform, opacity;
  transition: transform 250ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms ease, visibility 250ms;
}
.inspector.open {
  transform: translateX(0);
  opacity: 1;
  visibility: visible;
  pointer-events: auto;
}

@media (min-width: 1220px) {
  .inspector {
    position: relative;
    width: 360px;
    flex-shrink: 0;
    box-shadow: none;
    margin-right: -360px;
    transform: translateX(36px);
    transition: margin-right 250ms cubic-bezier(0.22, 1, 0.36, 1), transform 250ms cubic-bezier(0.22, 1, 0.36, 1), opacity 200ms ease, visibility 250ms;
  }
  .inspector.open {
    margin-right: 0;
    transform: translateX(0);
  }
  .inspector-backdrop.open { opacity: 0; visibility: hidden; pointer-events: none; }
}

@keyframes pickerIn {
  from { opacity: 0; transform: translateY(-6px); }
  to { opacity: 1; transform: translateY(0); }
}

.inspector-top {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 10px;
}

.inspector-hero {
  display: flex;
  align-items: center;
  gap: 12px;
}
.inspector-hero .app-icon { width: 48px; height: 48px; border-radius: 12px; font-size: 18px; cursor: pointer; transition: transform 140ms ease; }
.inspector-hero .app-icon:hover { transform: scale(1.06); }
.inspector-hero .app-icon.has-logo { background: transparent; border: none; border-radius: 0; overflow: visible; }
.inspector-hero .app-icon img { width: 46px; height: 46px; }

/* HD Logo Picker */
.logo-picker {
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 12px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  animation: pickerIn 180ms cubic-bezier(0.22, 1, 0.36, 1);
}
.logo-search-row {
  display: flex;
  gap: 6px;
}
.logo-search-input {
  flex: 1;
  min-width: 0;
  height: 32px;
  padding: 0 10px;
  border-radius: var(--radius-sm);
  border: 1px solid var(--border-strong);
  background: var(--bg-input);
  color: var(--text);
  font: inherit;
  font-size: 12.5px;
  outline: none;
}
.logo-search-input:focus { border-color: var(--accent); }
.logo-grid {
  display: grid;
  grid-template-columns: repeat(4, minmax(0, 1fr));
  gap: 8px;
  max-height: 224px;
  overflow-y: auto;
  padding-right: 2px;
}
.logo-source-line {
  font-size: 11.5px;
  color: var(--text-2);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
}
.logo-tile {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 4px;
  padding: 8px 4px;
  border-radius: 8px;
  border: 1px solid var(--border);
  background: var(--bg-input);
  cursor: pointer;
  transition: border-color var(--transition), background var(--transition), transform 110ms ease;
}
.logo-tile:hover {
  border-color: var(--accent);
  background: var(--bg-hover);
  transform: translateY(-1px);
}
.logo-tile img {
  width: 34px;
  height: 34px;
  object-fit: contain;
}
.logo-tile span {
  font-size: 10px;
  color: var(--text-3);
  max-width: 100%;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.inspector-name { font-size: 16px; font-weight: 700; word-break: break-word; }
.inspector-file { font-size: 12px; color: var(--text-3); font-family: var(--mono); margin-top: 2px; }

.info-box {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 12px 14px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}
.info-box-title {
  font-size: 11.5px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.45px;
  color: var(--text-3);
}
.info-field { display: flex; flex-direction: column; gap: 2px; }
.info-label { font-size: 11.5px; color: var(--text-3); }
.info-value { font-size: 13px; color: var(--text); word-break: break-word; user-select: text; }
.info-value.mono { font-family: var(--mono); font-size: 11.5px; color: var(--text-2); }

.inspector-actions {
  display: flex;
  flex-direction: column;
  gap: 8px;
}
.action-row { display: flex; gap: 8px; }
.action-row .btn { flex: 1; }

/* Settings */
.setting-row {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 16px;
  padding: 13px 0;
  border-bottom: 1px solid var(--border);
}
.setting-row:last-child { border-bottom: none; }
.setting-title { font-weight: 600; font-size: 13.5px; }
.setting-desc { font-size: 12px; color: var(--text-2); margin-top: 2px; }

.switch {
  position: relative;
  width: 42px; height: 24px;
  flex-shrink: 0;
}
.switch input { opacity: 0; width: 0; height: 0; }
.slider {
  position: absolute; inset: 0;
  background: var(--bg-input);
  border: 1px solid var(--border-strong);
  border-radius: 999px;
  cursor: pointer;
  transition: all var(--transition);
}
.slider:before {
  content: "";
  position: absolute;
  height: 16px; width: 16px;
  left: 3px; top: 3px;
  background: var(--text-2);
  border-radius: 50%;
  transition: all var(--transition);
}
.switch input:checked + .slider { background: var(--accent); border-color: var(--accent); }
.switch input:checked + .slider:before { transform: translateX(18px); background: #fff; }

/* Checkbox for cleanup */
.chk {
  width: 17px; height: 17px;
  accent-color: var(--accent);
  cursor: pointer;
  flex-shrink: 0;
}

/* Empty state */
.empty {
  text-align: center;
  padding: 46px 20px;
  color: var(--text-2);
  background: var(--bg-card);
  border: 1px dashed var(--border-strong);
  border-radius: var(--radius);
}
.empty-title { font-size: 15px; font-weight: 600; color: var(--text); margin-bottom: 5px; }

/* Toast */
.toast {
  position: fixed;
  bottom: 20px; right: 20px;
  background: var(--bg-card);
  border: 1px solid var(--border-strong);
  border-radius: var(--radius);
  padding: 11px 16px;
  box-shadow: var(--shadow);
  font-size: 13px;
  font-weight: 500;
  z-index: 300;
  opacity: 0;
  transform: translateY(10px);
  pointer-events: none;
  transition: all 180ms ease;
}
.toast.show { opacity: 1; transform: translateY(0); }

/* Release notes box */
.release-notes {
  margin-top: 10px;
  padding: 10px 12px;
  background: var(--bg-input);
  border: 1px solid var(--border);
  border-radius: var(--radius-sm);
  font-size: 12.5px;
  color: var(--text-2);
  white-space: pre-wrap;
  max-height: 160px;
  overflow-y: auto;
  user-select: text;
}
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-logo" id="brandLogo">SW</div>
      <div>
        <div class="brand-title"><span>Simple</span><span class="wall-accent">Wall</span></div>
        <div class="brand-sub" id="sidebarVersion">v4.2.9</div>
      </div>
    </div>

    <button class="nav-item active" data-page="overview">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
      <span class="nav-label">Overview</span>
    </button>
    <button class="nav-item" data-page="allowed">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M20 6L9 17l-5-5"/></svg>
      <span class="nav-label">Allowed Apps</span>
      <span class="nav-badge ok" id="navAllowed">0</span>
    </button>
    <button class="nav-item" data-page="blocked">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="4.93" y1="4.93" x2="19.07" y2="19.07"/></svg>
      <span class="nav-label">Blocked Apps</span>
      <span class="nav-badge danger" id="navBlocked">0</span>
    </button>
    <button class="nav-item" data-page="cleanup">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="3 6 5 6 21 6"/><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"/><path d="M10 11v6"/><path d="M14 11v6"/></svg>
      <span class="nav-label">Missing Cleanup</span>
      <span class="nav-badge warn" id="navMissing">0</span>
    </button>
    <button class="nav-item" data-page="activity">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="22 12 18 12 15 21 9 3 6 12 2 12"/></svg>
      <span class="nav-label">Live Activity</span>
      <span class="nav-badge" id="navActivity">0</span>
    </button>
    <button class="nav-item" data-page="diagnose">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="2" y1="12" x2="22" y2="12"/><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z"/></svg>
      <span class="nav-label">System Diagnose</span>
    </button>
    <button class="nav-item" data-page="settings">
      <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33h.01a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51h.01a1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82v.01a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg>
      <span class="nav-label">Settings & Updates</span>
    </button>

    <div class="sidebar-footer">
      <div class="theme-row">
        <span>Theme</span>
        <div class="segmented">
          <button id="themeDarkBtn" class="active" onclick="setTheme('dark')">Dark</button>
          <button id="themeLightBtn" onclick="setTheme('light')">Light</button>
        </div>
      </div>
    </div>
  </aside>

  <!-- Main Column -->
  <div class="main">
    <header class="topbar">
      <div class="mode-bar" id="modeBar">
        <button class="mode-btn" id="btnModeStrict" onclick="setMode('strict', 0)">
          <span class="dot dot-green"></span> Strict
        </button>
        <button class="mode-btn" id="btnModeSafe" onclick="toggleSafeMenu(event)">
          <span class="dot dot-amber"></span> <span id="safeLabel">Safe Pause ▾</span>
        </button>
        <button class="mode-btn" id="btnModeOff" onclick="confirmOff()">
          <span class="dot dot-red"></span> Off
        </button>

        <div class="dropdown-menu" id="safeMenu">
          <div class="dropdown-title">Pause new blocks (keep blocked apps blocked)</div>
          <button class="dropdown-item" onclick="setMode('safe_pause', 900)"><span>15 minutes</span><small>Auto-resume</small></button>
          <button class="dropdown-item" onclick="setMode('safe_pause', 1800)"><span>30 minutes</span><small>Auto-resume</small></button>
          <button class="dropdown-item" onclick="setMode('safe_pause', 3600)"><span>1 hour</span><small>Auto-resume</small></button>
          <button class="dropdown-item" onclick="setMode('safe_pause', 0)"><span>Until I resume</span><small>Manual</small></button>
        </div>
      </div>

      <div class="search-wrap">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input class="search-input" id="searchInput" type="text" placeholder="Search apps, publishers, or folders..." oninput="onSearch(this.value)">
      </div>

      <button class="icon-btn" title="Refresh list & running status" onclick="refreshAll()">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
      </button>
    </header>

    <div class="banner" id="modeBanner">
      <span id="bannerText"></span>
      <button class="btn btn-sm btn-green" onclick="setMode('strict', 0)">Resume Strict Protection</button>
    </div>

    <div class="workspace">
      <main class="content" id="pageContent"></main>
      <div class="inspector-backdrop" id="inspectorBackdrop" onclick="closeInspector()"></div>
      <aside class="inspector" id="inspector"></aside>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
const state = {
  page: 'overview',
  mode: 'off',
  safePauseRemaining: 0,
  isApplying: false,
  theme: 'dark',
  appVersion: '4.2.9',
  forkRepo: 'StrokeDot/simplewall',
  settings: {},
  apps: [],
  savedLogos: [],
  activity: [],
  search: '',
  filterAllowed: 'all',
  filterBlocked: 'all',
  groupByCompany: true,
  collapsedCompanies: new Set(),
  hideHarmlessActivity: false,
  includeSystem: false,
  selectedAppId: null,
  logoPickerOpen: false,
  logoPickerTab: 'library',
  logoLibraryFilter: '',
  logoQuery: '',
  logoSearching: false,
  logoResults: null,
  logoError: '',
  cleanupSelected: new Set(),
  cleanupFilter: 'all',
  diagnose: null,
  diagnoseFilter: 'external',
  updateInfo: null,
  updateStatus: 'idle',
  updateMessage: ''
};

function send(action, payload = {}) {
  if (window.chrome && window.chrome.webview) {
    window.chrome.webview.postMessage(JSON.stringify({ action, ...payload }));
  }
}

function showToast(msg) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(() => el.classList.remove('show'), 2800);
}

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function formatDuration(sec) {
  sec = Math.max(0, Math.floor(sec || 0));
  if (sec < 60) return `${sec}s`;
  const m = Math.floor(sec / 60);
  const s = sec % 60;
  if (m < 60) return s > 0 ? `${m}m ${s}s` : `${m}m`;
  const h = Math.floor(m / 60);
  const rm = m % 60;
  return rm > 0 ? `${h}h ${rm}m` : `${h}h`;
}

function formatDate(ts) {
  if (!ts) return 'Unknown';
  try {
    return new Date(ts * 1000).toLocaleString();
  } catch { return 'Unknown'; }
}

function getVisibleApps(kind) {
  const q = state.search.trim().toLowerCase();
  return state.apps.filter(a => {
    if (kind === 'allowed' && a.status !== 'allowed') return false;
    if (kind === 'blocked') {
      if (a.status !== 'blocked') return false;
      if (!state.includeSystem && (a.category === 'service' || a.category === 'uwp') && !a.isSilent) return false;
    }
    if (kind === 'missing') {
      if (a.exists) return false;
      if (a.isSystem) return false;
      if (state.cleanupFilter === 'blocked' && a.status !== 'blocked') return false;
      if (state.cleanupFilter === 'allowed' && a.status !== 'allowed') return false;
    }
    if (kind === 'allowed') {
      if (state.filterAllowed === 'running' && !a.isRunning) return false;
      if (state.filterAllowed === 'until_closed' && !a.isAllowUntilClosed) return false;
      if (state.filterAllowed === 'missing' && a.exists) return false;
      if (state.filterAllowed === 'timed' && !(a.timerRemaining > 0)) return false;
    }
    if (kind === 'blocked') {
      if (state.filterBlocked === 'ask_on_use' && !a.isAskOnUse) return false;
      if (state.filterBlocked === 'always' && a.isAskOnUse) return false;
      if (state.filterBlocked === 'installed' && !a.exists) return false;
      if (state.filterBlocked === 'running' && !a.isRunning) return false;
      if (state.filterBlocked === 'missing' && a.exists) return false;
    }
    if (q) {
      const hay = `${a.name} ${a.fileName} ${a.company} ${a.companyGroup} ${a.description} ${a.parentApp} ${a.path} ${a.wakeTriggerName}`.toLowerCase();
      if (!hay.includes(q)) return false;
    }
    return true;
  });
}

function applyThemeUI(theme) {
  state.theme = theme === 'light' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', state.theme);
  document.getElementById('themeDarkBtn').classList.toggle('active', state.theme === 'dark');
  document.getElementById('themeLightBtn').classList.toggle('active', state.theme === 'light');
}

function setTheme(theme) {
  applyThemeUI(theme);
  send('setTheme', { theme });
}

function setMode(mode, durationSeconds = 0) {
  document.getElementById('safeMenu').classList.remove('open');
  if (state.isApplying) return;
  state.isApplying = true;
  renderChrome();
  send('setMode', { mode, durationSeconds });
}

function confirmOff() {
  document.getElementById('safeMenu').classList.remove('open');
  if (state.mode === 'off') return;
  if (confirm('Turn the firewall completely OFF?\n\nThis will also unblock all previously blocked apps. If you want blocked apps to stay blocked, use Safe Pause instead.')) {
    setMode('off', 0);
  }
}

function toggleSafeMenu(e) {
  e.stopPropagation();
  document.getElementById('safeMenu').classList.toggle('open');
}

document.addEventListener('click', () => {
  document.getElementById('safeMenu').classList.remove('open');
});

function setPage(page) {
  state.page = page;
  document.querySelectorAll('.nav-item').forEach(b => {
    b.classList.toggle('active', b.dataset.page === page);
  });
  if (page === 'diagnose') send('getDiagnose');
  renderPage();
}

document.querySelectorAll('.nav-item').forEach(btn => {
  btn.addEventListener('click', () => setPage(btn.dataset.page));
});

function onSearch(val) {
  state.search = val;
  if (state.page === 'overview' && val.trim()) {
    setPage('blocked');
    return;
  }
  renderPage();
}

function refreshAll() {
  send('refresh');
  showToast('Refreshed app status');
}

function selectApp(id) {
  if (state.selectedAppId !== id) {
    state.logoPickerOpen = false;
    state.logoResults = null;
    state.logoSearching = false;
    state.logoError = '';
  }
  state.selectedAppId = id;
  renderPage();
  renderInspector();
}

function closeInspector() {
  state.selectedAppId = null;
  state.logoPickerOpen = false;
  state.logoResults = null;
  state.logoSearching = false;
  state.logoError = '';
  renderPage();
  renderInspector();
}

function defaultLogoQuery(a) {
  const raw = (a.name || a.fileName || '').replace(/\.exe$/i, '').replace(/[_-]+/g, ' ').trim();
  return raw.split(/\s+/).slice(0, 2).join(' ');
}

document.addEventListener('keydown', e => {
  if (e.key === 'Escape' && state.selectedAppId) {
    closeInspector();
  }
});

function getAppLogoLibrary() {
  const seen = new Set();
  const out = [];
  for (const s of (state.savedLogos || [])) {
    if (!s || !s.dataUrl || seen.has(s.dataUrl)) continue;
    seen.add(s.dataUrl);
    out.push({
      name: s.name || 'Saved Logo',
      fileName: '',
      source: 'Uploaded / Saved Library',
      dataUrl: s.dataUrl
    });
  }
  for (const app of state.apps) {
    if (!app.iconDataUrl) continue;
    if (seen.has(app.iconDataUrl)) continue;
    seen.add(app.iconDataUrl);
    out.push({
      name: app.name || app.fileName || 'App',
      fileName: app.fileName || '',
      source: app.iconSource || '',
      dataUrl: app.iconDataUrl
    });
  }
  out.sort((x, y) => x.name.localeCompare(y.name));
  window._logoLibraryItems = out;
  return out;
}

function toggleLogoPicker() {
  const a = state.apps.find(x => x.id === state.selectedAppId);
  if (!a) return;
  state.logoPickerOpen = !state.logoPickerOpen;
  if (state.logoPickerOpen) {
    state.logoPickerTab = 'library';
    state.logoLibraryFilter = '';
    state.logoQuery = defaultLogoQuery(a);
    state.logoResults = null;
    state.logoError = '';
  }
  renderInspector();
}

function setLogoPickerTab(tab) {
  state.logoPickerTab = tab;
  if (tab === 'online' && !state.logoResults && !state.logoSearching && state.logoQuery) {
    searchOnlineLogos(state.logoQuery);
    return;
  }
  renderInspector();
}

function renderLogoLibraryGridHtml(library, query) {
  const lq = (query || '').trim().toLowerCase();
  const indexed = library.map((it, idx) => ({ it, idx }));
  const filteredLib = lq
    ? indexed.filter(({ it }) => `${it.name} ${it.fileName} ${it.source}`.toLowerCase().includes(lq))
    : indexed;
  return filteredLib.length
    ? `<div class="logo-grid">${filteredLib.map(({ it, idx }) =>
        `<button class="logo-tile" title="${esc(it.name)}${it.source ? ' · ' + esc(it.source) : ''}" onclick="applyLibraryLogo(${idx})">
          <img src="${it.dataUrl}" alt="">
          <span>${esc(it.name)}</span>
        </button>`
      ).join('')}</div>`
    : `<div style="font-size:12px;color:var(--text-3);padding:6px 0">No matching logos in your app library. Try the Online HD tab or pick a file from your PC.</div>`;
}

function onLogoLibFilter(val) {
  state.logoLibraryFilter = val;
  const host = document.getElementById('logoLibGridHost');
  if (host) host.innerHTML = renderLogoLibraryGridHtml(getAppLogoLibrary(), val);
}

function applyLibraryLogo(libIdx) {
  const target = state.apps.find(x => x.id === state.selectedAppId);
  const src = (window._logoLibraryItems || [])[libIdx];
  if (!target || !src || !src.dataUrl) return;
  showToast(`Applied ${src.name} logo`);
  send('applyDataUrlLogo', { id: target.id, dataUrl: src.dataUrl });
}

function searchOnlineLogos(query) {
  const a = state.apps.find(x => x.id === state.selectedAppId);
  if (!a) return;
  const q = (query !== undefined ? query : state.logoQuery || '').trim();
  if (!q) return;
  state.logoQuery = q;
  state.logoSearching = true;
  state.logoError = '';
  renderInspector();
  send('searchLogos', { id: a.id, query: q });
}

function applyOnlineLogo(slug) {
  const a = state.apps.find(x => x.id === state.selectedAppId);
  if (!a || !slug) return;
  showToast(`Applying ${slug} logo...`);
  send('applyOnlineLogo', { id: a.id, slug });
}

function pickCustomLogoFile() {
  const a = state.apps.find(x => x.id === state.selectedAppId);
  if (!a) return;
  send('pickCustomLogo', { id: a.id });
}

function resetCustomLogo() {
  const a = state.apps.find(x => x.id === state.selectedAppId);
  if (!a) return;
  send('resetCustomLogo', { id: a.id });
  showToast('Restored default logo');
}

function allowApp(id, durationSeconds = 0, e = null, untilClosed = false) {
  if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
  send('allowApp', { id, durationSeconds, untilClosed: !!untilClosed });
  if (untilClosed) showToast('Allowed until closed (will ask again next time)');
  else showToast(durationSeconds ? `Allowed for ${formatDuration(durationSeconds)}` : 'App allowed');
}

function blockApp(id, e = null, askOnUse = false) {
  if (e && typeof e.stopPropagation === 'function') e.stopPropagation();
  send('blockApp', { id, askOnUse: !!askOnUse });
  showToast(askOnUse ? 'Blocked in background — will ask when opened' : 'App permanently blocked');
}

function setWakeTrigger(id, triggerPath) {
  send('setWakeTrigger', { id, triggerPath: triggerPath || '' });
  showToast(triggerPath ? 'Updated linked trigger app' : 'Reset to Auto (same app / suite)');
}

function toggleCompanyGroup(scope, company) {
  const key = `${scope}::${company}`;
  if (state.collapsedCompanies.has(key)) state.collapsedCompanies.delete(key);
  else state.collapsedCompanies.add(key);
  renderPage();
}

function setAllCompaniesCollapsed(scope, companies, collapse) {
  for (const c of companies) {
    const key = `${scope}::${c}`;
    if (collapse) state.collapsedCompanies.add(key);
    else state.collapsedCompanies.delete(key);
  }
  renderPage();
}

function deleteApps(ids) {
  if (!ids || !ids.length) return;
  const label = ids.length === 1 ? 'this entry' : `${ids.length} missing entries`;
  if (!confirm(`Remove ${label} from your firewall list?`)) return;
  ids.forEach(id => state.cleanupSelected.delete(id));
  if (ids.includes(state.selectedAppId)) state.selectedAppId = null;
  send('deleteApps', { ids });
  showToast(`Removed ${ids.length} ${ids.length === 1 ? 'entry' : 'entries'}`);
}

function renderChrome() {
  document.getElementById('sidebarVersion').textContent = `v${state.appVersion}`;
  const allowedCount = state.apps.filter(a => a.status === 'allowed').length;
  const blockedCount = state.apps.filter(a => a.status === 'blocked' && (state.includeSystem || a.isSilent || (a.category !== 'service' && a.category !== 'uwp'))).length;
  const missingCount = state.apps.filter(a => !a.exists && !a.isSystem).length;

  document.getElementById('navAllowed').textContent = allowedCount;
  document.getElementById('navBlocked').textContent = blockedCount;
  document.getElementById('navMissing').textContent = missingCount;
  document.getElementById('navActivity').textContent = state.activity.length;

  const bStrict = document.getElementById('btnModeStrict');
  const bSafe = document.getElementById('btnModeSafe');
  const bOff = document.getElementById('btnModeOff');
  bStrict.className = 'mode-btn' + (state.mode === 'strict' ? ' active-strict' : '');
  bSafe.className = 'mode-btn' + (state.mode === 'safe_pause' ? ' active-safe' : '');
  bOff.className = 'mode-btn' + (state.mode === 'off' ? ' active-off' : '');

  const safeLabel = document.getElementById('safeLabel');
  if (state.mode === 'safe_pause' && state.safePauseRemaining > 0) {
    safeLabel.textContent = `Safe Pause (${formatDuration(state.safePauseRemaining)}) ▾`;
  } else {
    safeLabel.textContent = 'Safe Pause ▾';
  }

  const banner = document.getElementById('modeBanner');
  const bannerText = document.getElementById('bannerText');
  if (state.isApplying) {
    banner.className = 'banner show safe';
    bannerText.textContent = 'Applying Windows firewall rules safely...';
  } else if (state.mode === 'safe_pause') {
    banner.className = 'banner show safe';
    const rem = state.safePauseRemaining > 0 ? ` — resumes Strict Protection in ${formatDuration(state.safePauseRemaining)}` : ' — until you resume';
    bannerText.textContent = `Safe Pause is ON: new apps can connect, while all ${blockedCount} blocked apps stay strictly blocked${rem}.`;
  } else if (state.mode === 'off') {
    banner.className = 'banner show off';
    bannerText.textContent = 'Firewall is completely OFF. All apps (including blocked ones) can connect.';
  } else {
    banner.className = 'banner';
  }
}

function appIconHtml(a) {
  if (a && a.iconDataUrl) return `<div class="app-icon has-logo"><img src="${a.iconDataUrl}" alt=""></div>`;
  const ch = ((a && (a.name || a.fileName)) || '?').trim().charAt(0).toUpperCase() || '?';
  return `<div class="app-icon">${esc(ch)}</div>`;
}

function renderAppRow(a, mode) {
  const isSel = state.selectedAppId === a.id;
  const subParts = [];
  if (a.company) subParts.push(a.company);
  else if (a.parentApp) subParts.push(a.parentApp);
  if (a.description && a.description !== a.name) subParts.push(a.description);
  if (!subParts.length) subParts.push(a.path || a.fileName);

  const badges = [];
  if (a.isRunning) badges.push(`<span class="pill pill-green"><span class="dot dot-green" style="width:6px;height:6px;box-shadow:none"></span>Running</span>`);
  if (a.status === 'allowed' && a.isAllowUntilClosed) badges.push(`<span class="pill pill-blue">Until Closed</span>`);
  if (a.status === 'blocked' && a.isAskOnUse) {
    const trigLabel = a.wakeTriggerName ? ` · ${esc(a.wakeTriggerName)}` : '';
    badges.push(`<span class="pill pill-amber">Ask on Open${trigLabel}</span>`);
  } else if (mode === 'blocked' && !a.isAskOnUse) {
    badges.push(`<span class="pill pill-muted">Always Blocked</span>`);
  }
  if (!a.exists) badges.push(`<span class="pill pill-amber">Missing from PC</span>`);
  if (a.timerRemaining > 0) badges.push(`<span class="pill pill-blue">${formatDuration(a.timerRemaining)} left</span>`);
  if (a.exists && a.signature && mode !== 'blocked') badges.push(`<span class="pill pill-muted">Signed</span>`);

  const chkHtml = mode === 'cleanup'
    ? `<input class="chk" type="checkbox" ${state.cleanupSelected.has(a.id) ? 'checked' : ''} onclick="event.stopPropagation(); toggleCleanup('${a.id}', this.checked)">`
    : '';

  let actionHtml = '';
  if (mode === 'allowed') {
    actionHtml = `<button class="btn btn-sm btn-amber" title="Block silently in background, and ask again when you open this app or its related app" onclick="blockApp('${a.id}', event, true)">Ask on Open</button>
      <button class="btn btn-sm btn-red" title="Block permanently and never ask again" onclick="blockApp('${a.id}', event, false)">Block</button>`;
  } else if (mode === 'blocked') {
    const modeBtn = a.isAskOnUse
      ? `<button class="btn btn-sm" title="Switch to Always Blocked (never ask again)" onclick="blockApp('${a.id}', event, false)">Always Block</button>`
      : `<button class="btn btn-sm btn-amber" title="Keep blocked in background, but ask again when opened" onclick="blockApp('${a.id}', event, true)">Ask on Open</button>`;
    actionHtml = `${modeBtn}<button class="btn btn-sm btn-green" onclick="allowApp('${a.id}', 0, event, false)">Allow</button>`;
    if (!a.exists && !a.isSystem) {
      actionHtml += `<button class="btn btn-sm" onclick="event.stopPropagation(); deleteApps(['${a.id}'])">Remove</button>`;
    }
  } else if (mode === 'cleanup') {
    actionHtml = `<span class="pill ${a.status === 'allowed' ? 'pill-green' : 'pill-red'}">${a.status === 'allowed' ? 'Allowed' : 'Blocked'}</span>
      <button class="btn btn-sm btn-red" onclick="event.stopPropagation(); deleteApps(['${a.id}'])">Remove</button>`;
  }

  return `<div class="app-row ${isSel ? 'selected' : ''}" onclick="selectApp('${a.id}')">
    ${chkHtml}
    ${appIconHtml(a)}
    <div class="app-main">
      <div class="app-name-line">
        <span class="app-name">${esc(a.name || a.fileName)}</span>
        ${badges.join('')}
      </div>
      <div class="app-sub">${esc(subParts.join(' · '))}</div>
    </div>
    <div class="row-actions">${actionHtml}</div>
  </div>`;
}

function compareCompanyNames(a, b) {
  if (a === b) return 0;
  if (a === 'Windows') return -1;
  if (b === 'Windows') return 1;
  if (a === 'Other / Independent') return 1;
  if (b === 'Other / Independent') return -1;
  return a.localeCompare(b, undefined, { sensitivity: 'base' });
}

function sortAppsWithinGroup(arr, mode) {
  return arr.slice().sort((x, y) => {
    if (x.isRunning !== y.isRunning) return x.isRunning ? -1 : 1;
    if (mode === 'blocked' && x.isAskOnUse !== y.isAskOnUse) return x.isAskOnUse ? -1 : 1;
    const nx = (x.name || x.fileName || '').toLowerCase();
    const ny = (y.name || y.fileName || '').toLowerCase();
    return nx.localeCompare(ny);
  });
}

function renderGroupedAppList(list, mode) {
  if (!state.groupByCompany) {
    const sorted = sortAppsWithinGroup(list, mode);
    return `<div class="list">${sorted.map(a => renderAppRow(a, mode)).join('')}</div>`;
  }

  const groups = new Map();
  for (const a of list) {
    const comp = (a.companyGroup && a.companyGroup.trim()) ? a.companyGroup.trim() : 'Other / Independent';
    if (!groups.has(comp)) groups.set(comp, []);
    groups.get(comp).push(a);
  }

  const companyNames = Array.from(groups.keys()).sort(compareCompanyNames);
  const autoExpandAll = state.search.trim().length > 0;

  return `<div class="company-groups">${companyNames.map(comp => {
    const items = sortAppsWithinGroup(groups.get(comp), mode);
    const key = `${mode}::${comp}`;
    const isCollapsed = !autoExpandAll && state.collapsedCompanies.has(key);
    const runningCount = items.filter(x => x.isRunning).length;
    const askCount = mode === 'blocked' ? items.filter(x => x.isAskOnUse).length : 0;
    const safeComp = comp.replace(/\\/g, '\\\\').replace(/'/g, "\\'");

    return `<div class="company-group ${isCollapsed ? 'collapsed' : ''}">
      <div class="company-header" onclick="toggleCompanyGroup('${mode}', '${safeComp}')">
        <div class="company-header-left">
          <span class="company-chevron">▾</span>
          <span class="company-title">${esc(comp)}</span>
          <span class="pill pill-muted">${items.length}</span>
        </div>
        <div class="company-meta">
          ${runningCount > 0 ? `<span class="pill pill-green">${runningCount} running</span>` : ''}
          ${askCount > 0 ? `<span class="pill pill-amber">${askCount} ask on open</span>` : ''}
        </div>
      </div>
      <div class="company-body">
        ${items.map(a => renderAppRow(a, mode)).join('')}
      </div>
    </div>`;
  }).join('')}</div>`;
}

function toggleCleanup(id, checked) {
  if (checked) state.cleanupSelected.add(id);
  else state.cleanupSelected.delete(id);
  renderPage();
}

      </div>

        <div class="mode-card-title"><span class="dot dot-red"></span> Firewall Off</div>

      </div>
    </div>

    <div class="grid-4">
      <div class="card stat-card" onclick="setPage('allowed')">

        <div class="stat-val" style="color:var(--green)">${allowed.length}</div>
        <div class="stat-hint">${allowed.filter(a=>a.isRunning).length} running right now</div>
      </div>
      <div class="card stat-card" onclick="setPage('blocked')">

  `;

function renderActivityRow(ev) {
  const app = state.apps.find(a => a.id === ev.appId);
  const name = ev.appName || (app && app.name) || ev.path || 'Unknown';
  const isAppAllowed = !!(app && app.status === 'allowed');
  const badge = ev.isAllow
    ? `<span class="pill pill-green">Allowed</span>`
    : (ev.isHarmless
      ? `<span class="pill pill-muted">Blocked</span>`
      : `<span class="pill pill-red">Blocked</span>`);
  const dest = ev.remoteAddr ? `${ev.remoteAddr}${ev.remotePort ? ':' + ev.remotePort : ''}` : 'Local / Unknown';

  const countPill = (ev.count && ev.count > 1)
    ? `<span class="pill pill-amber">×${ev.count} tries</span>`
    : '';

  let reasonPill = '';
  if (!ev.isAllow && ev.reason) {
    if (ev.isHarmless) {
      reasonPill = `<span class="pill pill-blue">${esc(ev.reason)} (Harmless)</span>`;
    } else {
      reasonPill = `<span class="pill pill-red">${esc(ev.reason)} (Affects App)</span>`;
    }
  }

  let actionHtml = '';
  if (ev.appId && !ev.isAllow) {
    if (isAppAllowed) {
      actionHtml = `<span class="pill pill-green">App Allowed</span>`;
    } else {
      actionHtml = `<button class="btn btn-sm btn-green" onclick="allowApp('${ev.appId}', 0, event)">Allow</button>`;
    }
  } else if (ev.appId && ev.isAllow) {
    actionHtml = `<button class="btn btn-sm btn-red" onclick="blockApp('${ev.appId}', event)">Block</button>`;
  }

  return `<div class="app-row" onclick="${ev.appId ? `selectApp('${ev.appId}')` : ''}">
    ${appIconHtml(app || { name })}
    <div class="app-main">
      <div class="app-name-line">
        ${badge}
        <span class="app-name">${esc(name)}</span>
        ${reasonPill}
        ${countPill}
        <span class="pill pill-muted">${esc(ev.protocol || 'NET')} · ${esc(ev.direction || 'Out')}</span>
      </div>
      <div class="app-sub">${esc(dest)} · ${esc(formatDate(ev.timestamp))}</div>
    </div>
    <div class="row-actions">${actionHtml}</div>
  </div>`;
}

function renderActivity() {
  const q = state.search.trim().toLowerCase();
  const harmlessCount = state.activity.filter(ev => !ev.isAllow && ev.isHarmless).length;
  const list = state.activity.filter(ev => {
    if (state.hideHarmlessActivity && !ev.isAllow && ev.isHarmless) return false;
    if (!q) return true;
    return `${ev.appName} ${ev.path} ${ev.remoteAddr} ${ev.protocol} ${ev.reason || ''}`.toLowerCase().includes(q);
  });

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Live Activity</div>
        <div class="page-sub">Real-time feed of network attempts with plain-English block reasons. Click any row to inspect the app.</div>
      </div>
      <button class="btn" onclick="send('clearActivity')">Clear Feed</button>
    </div>
    <div class="toolbar-row">
      <div class="chips">
        <button class="chip ${!state.hideHarmlessActivity?'active':''}" onclick="state.hideHarmlessActivity=false;renderPage()">All Activity (${state.activity.length})</button>
        <button class="chip ${state.hideHarmlessActivity?'active':''}" onclick="state.hideHarmlessActivity=!state.hideHarmlessActivity;renderPage()">Hide Harmless Noise${harmlessCount ? ` (${harmlessCount})` : ''}</button>
      </div>
      <div style="font-size:12px;color:var(--text-3)">Showing ${list.length} of ${state.activity.length}</div>
    </div>
    ${list.length ? `<div class="list">${list.map(ev => renderActivityRow(ev)).join('')}</div>`
      : `<div class="empty"><div class="empty-title">${state.hideHarmlessActivity && state.activity.length ? 'No app-affecting blocks!' : 'Waiting for activity'}</div>${state.hideHarmlessActivity && state.activity.length ? 'All recent blocked items were harmless background noise (like local discovery or trackers).' : 'Blocked and logged connection attempts will show up here automatically.'}</div>`}
  `;
}

function toggleSetting(key, val) {
  state.settings[key] = val;
  send('updateSetting', { key, value: val });
  showToast('Setting updated');
}

function renderSettings() {
  const s = state.settings;
  let updateBody = '';

  if (state.updateStatus === 'checking') {
    updateBody = `<div style="font-size:13px;color:var(--accent);margin-top:8px">Checking for updates...</div>`;
  } else if (state.updateStatus === 'downloading') {
    updateBody = `<div style="font-size:13px;color:var(--amber);margin-top:8px">${esc(state.updateMessage || 'Downloading update...')}</div>`;
  } else if (state.updateStatus === 'error') {
    updateBody = `<div style="font-size:13px;color:var(--red);margin-top:8px">${esc(state.updateMessage || 'Could not check for updates.')}</div>`;
  } else if (state.updateInfo) {
    const u = state.updateInfo;
    if (u.hasUpdate) {
      updateBody = `
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-top:10px">
          <div>
            <div style="font-weight:700;color:var(--green)">Update available: ${esc(u.latestVersion)}</div>
          </div>
          ${u.downloadUrl
            ? `<button class="btn btn-primary" onclick="installUpdate()">Download & Install</button>`
            : `<button class="btn btn-primary" onclick="send('openUrl', { url: '${esc(u.htmlUrl)}' })">Open Release Page</button>`}
        </div>
        ${u.releaseNotes ? `<div class="release-notes">${esc(u.releaseNotes)}</div>` : ''}
      `;
    } else {
      updateBody = `<div style="font-size:13px;color:var(--green);margin-top:8px">You're up to date (v${esc(state.appVersion)}).</div>`;

  return `
    <div class="page-header">
      <div>
        <div class="page-title">Settings & Updates</div>
        <div class="page-sub">Appearance, alerts, protection rules, and updates.</div>

    </div>

    <div class="grid-2">
      <div class="card" style="display:flex;flex-direction:column;justify-content:center">
        <div style="display:flex;align-items:center;justify-content:space-between;gap:12px">
          <div>
            <div style="font-weight:700;font-size:14.5px">Updater</div>
            <div style="font-size:12px;color:var(--text-3);margin-top:2px">v${esc(state.appVersion)}</div>
          </div>
          <button class="btn btn-sm btn-primary" onclick="checkForUpdates()" ${state.updateStatus==='checking'||state.updateStatus==='downloading'?'disabled':''}>Check Updates</button>
        </div>
        ${updateBody}
      </div>

      <div class="card" style="display:flex;align-items:center;justify-content:space-between;gap:12px">
        <div>
          <div style="font-weight:700;font-size:14.5px">Theme</div>
          <div style="font-size:12px;color:var(--text-2);margin-top:2px">Switch Dark or Light mode</div>

    <div class="card" style="margin-bottom:16px">

      <div class="setting-row">

        <label class="switch"><input type="checkbox" ${s.notifications?'checked':''} onchange="toggleSetting('IsNotificationsEnabled', this.checked)"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-title">Notification Sound</div>
          <div class="setting-desc">Play a sound when a pop-up alert appears.</div>

        <label class="switch"><input type="checkbox" ${s.sound?'checked':''} onchange="toggleSetting('IsNotificationsSound', this.checked)"><span class="slider"></span></label>
      </div>

    <div class="card">
      <div style="font-weight:700;font-size:15px;margin-bottom:4px">Firewall Rules</div>

          <div class="setting-title">Block Inbound Connections</div>
          <div class="setting-desc">Reject unsolicited incoming connections from the network (stays active even in Safe Pause).</div>
        </div>
        <label class="switch"><input type="checkbox" ${s.blockInbound?'checked':''} onchange="toggleSetting('BlockInboundConnections', this.checked)"><span class="slider"></span></label>
      </div>
      <div class="setting-row">
        <div>
          <div class="setting-title">Stealth Mode</div>
          <div class="setting-desc">Silently drop port-scanning probes so your PC stays invisible on networks.</div>
